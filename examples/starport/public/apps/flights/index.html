<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flights</title>
    <style>
/* The palette comes from the desk when there is one; the fallbacks are this app's own. */
      :host, body { margin: 0; }
      .app { font: 14px/1.45 var(--sp-font, system-ui, sans-serif); color: var(--sp-text, #eef0fb); padding: 18px 20px 20px; min-height: 380px; box-sizing: border-box; }
      .app * { box-sizing: border-box; }
      h2 { margin: 0 44px 2px 0; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
      h2::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 12px var(--dot); }
      .sub { margin: 0 0 14px; color: var(--sp-dim, #99a1c4); font-size: 13px; min-height: 19px; }
      button { font: inherit; color: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--sp-line, #94a3ff2e); background: rgba(255, 255, 255, 0.05); padding: 5px 11px; font-weight: 600; }
      button:hover { border-color: var(--dot); }
      .mono { font-family: var(--sp-mono, ui-monospace, monospace); }
      .app { --dot: var(--sp-amber, #fbbf24); }
      table { width: 100%; border-collapse: collapse; }
      th { text-align: start; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sp-dim, #99a1c4); padding: 0 8px 6px; font-weight: 600; }
      td { padding: 7px 8px; border-top: 1px solid var(--sp-line, #94a3ff2e); white-space: nowrap; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: rgba(255, 255, 255, 0.04); }
      tr[aria-current] { background: rgba(251, 191, 36, 0.1); box-shadow: inset 3px 0 0 var(--dot); }
      .name { font-weight: 700; display: block; }
      .name + span { font-size: 11px; }
      .pill { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: rgba(45, 212, 191, 0.15); color: var(--sp-teal, #2dd4bf); }
      .pill.delayed { background: rgba(244, 114, 182, 0.15); color: var(--sp-pink, #f472b6); }
      .pill.boarding { background: rgba(251, 191, 36, 0.15); color: var(--sp-amber, #fbbf24); }
      .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
      .actions span { color: var(--sp-dim, #99a1c4); margin-inline-end: auto; }
      .actions button:disabled { opacity: 0.4; cursor: default; }
      #plot { background: linear-gradient(135deg, var(--sp-indigo, #818cf8), var(--sp-teal, #2dd4bf)); color: #0b1020; border: 0; }
    </style>
  </head>
  <body>
    <div class="app">
      <h2>Flights</h2>
      <p class="sub">Pick a ship. Every app on the desk follows.</p>
      <table>
        <thead><tr><th>Ship</th><th>Route</th><th>ETA</th><th>Status</th></tr></thead>
        <tbody id="ships"></tbody>
      </table>
      <div class="actions">
        <span id="picked">No ship selected</span>
        <button id="hail" disabled>Hail</button>
        <button id="plot" disabled>Plot route</button>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
