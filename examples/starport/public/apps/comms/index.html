<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Comms</title>
    <style>
/* The palette comes from the desk when there is one; the fallbacks are this app's own. */
      :host, body { margin: 0; }
      .app { font: 14px/1.45 var(--sp-font, system-ui, sans-serif); color: var(--sp-text, #eef0fb); padding: 18px 20px 20px; min-height: 380px; box-sizing: border-box; }
      .app * { box-sizing: border-box; }
      h2 { margin: 0 0 2px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
      h2::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 12px var(--dot); }
      .sub { margin: 0 0 14px; color: var(--sp-dim, #99a1c4); font-size: 13px; min-height: 19px; }
      button { font: inherit; color: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--sp-line, #94a3ff2e); background: rgba(255, 255, 255, 0.05); padding: 5px 11px; font-weight: 600; }
      button:hover { border-color: var(--dot); }
      .mono { font-family: var(--sp-mono, ui-monospace, monospace); }
      /* a narrow tile: on a phone, or squeezed beside others */
      @media (max-width: 720px) { .app { padding: 16px; min-height: 0; } }
      .app { --dot: var(--sp-teal, #2dd4bf); }
      #log { height: 236px; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; border: 1px solid var(--sp-line, #94a3ff2e); background: rgba(0, 0, 0, 0.25); }
      #log p { margin: 0; padding: 7px 12px; border-radius: 12px; max-width: 85%; background: rgba(255, 255, 255, 0.07); }
      #log p.me { align-self: flex-end; background: rgba(129, 140, 248, 0.3); }
      #log p.sys { align-self: center; background: none; color: var(--sp-dim, #99a1c4); font-size: 12px; }
      #tower { margin-inline-start: auto; font: 500 11px var(--sp-mono, ui-monospace, monospace); letter-spacing: 0; text-transform: none; color: var(--sp-dim, #99a1c4); }
      form { display: flex; gap: 8px; margin-top: 10px; }
      input { flex: 1; font: inherit; color: inherit; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--sp-line, #94a3ff2e); background: rgba(255, 255, 255, 0.05); }
    </style>
  </head>
  <body>
    <div class="app">
      <h2>Comms <span id="tower"></span></h2>
      <p class="sub" id="status">No channel open. Hail a ship from Flights.</p>
      <div id="log"></div>
      <form id="send"><input id="message" placeholder="Say something" aria-label="Message" /><button>Send</button></form>
    </div>
    <script src="app.js"></script>
  </body>
</html>
