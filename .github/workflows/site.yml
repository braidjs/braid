name: Site

# Builds apps/site and deploys it to Cloudflare: a Worker serving the static site, plus the contact
# form's POST /api/contact.
#
# Needs, in the repository's settings:
#   secrets.CLOUDFLARE_API_TOKEN   — an API token with "Edit Cloudflare Workers" permission
#   vars.CLOUDFLARE_ACCOUNT_ID     — the account the Worker lives in
#   vars.TURNSTILE_SITEKEY         — the Turnstile widget's site key (public)
# and, once, on Cloudflare:  npx wrangler secret put TURNSTILE_SECRET --config apps/site/wrangler.jsonc
on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'libs/core/**'
      - 'libs/skew/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel a running deploy midway.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Refuse a half-configured deploy rather than ship a form that can't work.
      - name: Check the deploy is configured
        run: |
          if [ -z "$SITE_TURNSTILE_SITEKEY" ]; then
            echo "::error::Set the TURNSTILE_SITEKEY repository variable (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if grep -q 'example\.com' apps/site/wrangler.jsonc; then
            echo "::error::Replace the example.com addresses in apps/site/wrangler.jsonc with your real ones."
            exit 1
          fi

      - run: npm ci
      - run: npx nx run-many -t lint test -p site
      - run: npx nx build site
      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config apps/site/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
