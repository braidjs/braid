name: Release

# Manual on purpose. Publishing to npm cannot be undone — a version number is
# spent the moment it is taken, and `npm unpublish` is unavailable after 72
# hours — so a release is something a person decides to do, not something a
# merge triggers by accident.
on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version bump (patch | minor | major | or an exact version like 0.1.0)'
        required: true
        default: 'minor'
      dry-run:
        description: 'Rehearse without publishing or pushing'
        type: boolean
        default: true
      tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'

# Read-only by default, so the verify call to ci.yml gets nothing more; publish asks for its own.
permissions:
  contents: read

concurrency:
  # Never two releases at once: they would race for the same version number.
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # Nothing ships that has not passed the same gate every push passes.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    # A dispatch can name any ref, and publish runs before the push to main that would fail for a
    # branch that is not main. Without this, an unreviewed branch ships to npm with provenance.
    if: github.ref == 'refs/heads/main'
    # Required reviewers and the main-only deployment rule live on this environment, in the repo
    # settings. npm's trusted publisher for each package names this workflow and environment.
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and its tags
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Same toolchain as CI and local development; see the note in ci.yml.
          node-version-file: .nvmrc
          cache: npm
          # No `registry-url`: it writes an .npmrc whose token falls back to a placeholder when no
          # NODE_AUTH_TOKEN is set, and npm would send that instead of using OIDC. The default
          # registry is already registry.npmjs.org. Trusted publishing needs npm 11.5.1 or later,
          # which the .nvmrc Node ships.

      # No lifecycle scripts: this job holds a write token and the OIDC identity npm publishes
      # under, and nothing the build needs runs at install time.
      - run: npm ci --ignore-scripts

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refuse a version npm already has
        # Run #11 asked for "0.1.1", already on npm: publish skipped every package and still
        # reported success. An exact version is checked here, before anything is built.
        # Inputs reach the shell through env, never by template expansion into the script.
        run: node tools/release/check-version-unspent.mjs "$SPECIFIER"
        env:
          SPECIFIER: ${{ inputs.specifier }}

      - name: Version, changelog, and tag
        # One command, so the bump resolves once for all three. `nx release changelog` takes a
        # version, not a bump: given "patch" it wrote "# patch" into CHANGELOG.md, committed
        # "publish patch" and tagged `vpatch` (the 0.7.1 run), while `version` correctly wrote 0.7.1.
        # Publishing stays its own step below, after the checks on what versioning produced.
        run: npx nx release "$SPECIFIER" --skip-publish $DRY_RUN
        env:
          SPECIFIER: ${{ inputs.specifier }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse a resolved version npm already has
        # A bump keyword resolves from the latest v{version} tag; a missing tag would resolve to a
        # spent version. Checks what the version step actually wrote into dist/.
        run: node tools/release/check-version-unspent.mjs

      - name: Refuse unpublishable output
        # npm pack never runs prepublishOnly; only publish does. This is the check that would
        # have caught the full-compilation-mode Angular libraries before the first dry run did.
        run: node tools/release/check-publishable.mjs

      - name: Publish to npm
        run: npx nx release publish --tag "$DIST_TAG" $DRY_RUN
        env:
          DIST_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          # No token: npm trusted publishing exchanges this job's OIDC identity for a short-lived
          # publish credential. Each @braidlabs package needs a trusted publisher on npmjs.com
          # naming braidjs/braid, release.yml and the `release` environment. A long-lived token
          # in repo secrets is readable by any workflow a collaborator pushes on any branch.
          NPM_CONFIG_PROVENANCE: true

      - name: Push the release record
        # Without this, the changelog commit and the v{version} tag exist only
        # in this runner and evaporate when it exits — which is exactly what
        # happened to v0.1.0: npm had it, the repo had no record, and the next
        # release would have resolved its current version from the disk
        # fallback and collided with the version already spent on npm. The
        # push runs AFTER publish on purpose: a failed publish must not leave
        # a tag pointing at a release that never shipped.
        if: ${{ !inputs.dry-run }}
        run: git push --follow-tags origin HEAD:main

      - name: Publish the GitHub release
        # Last, against the pushed tag: the version's CHANGELOG.md section becomes the release notes
        # on GitHub. See tools/release/github-release.mjs for why nx does not create it itself.
        if: ${{ !inputs.dry-run }}
        run: node tools/release/github-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
